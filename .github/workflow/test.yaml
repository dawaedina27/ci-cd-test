name: CI pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install linting and testing tools
        run: pip install flake8 pytest

      - name: Run flake8 linter
        run: flake8 calculator.py test_calculator.py --max-line-length=88 --extend-ignore=E203

      - name: Run tests
        run: pytest test_calculator.py